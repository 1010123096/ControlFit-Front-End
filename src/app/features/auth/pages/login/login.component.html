<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">CF</div>
      <h1 class="login-title">ControlFit</h1>
      <p class="login-subtitle">Inicia sesión para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Correo electrónico</mat-label>
        <input matInput formControlName="correo" type="email" placeholder="correo@ejemplo.com" autocomplete="email">
        <mat-error *ngIf="loginForm.get('correo')?.hasError('required')">El correo es requerido</mat-error>
        <mat-error *ngIf="loginForm.get('correo')?.hasError('email')">Correo inválido</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="contrasena" autocomplete="current-password">
        <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword" [attr.aria-label]="'Toggle password visibility'" [attr.aria-pressed]="hidePassword">
          <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
        </button>
        <mat-error *ngIf="loginForm.get('contrasena')?.hasError('required')">La contraseña es requerida</mat-error>
        <mat-error *ngIf="loginForm.get('contrasena')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
      </mat-form-field>

      <button mat-raised-button color="primary" class="full-width submit-btn" type="submit" [disabled]="loading || loginForm.invalid">
        <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
        <span *ngIf="!loading">Ingresar</span>
      </button>
    </form>

    <p class="login-footer">ControlFit &copy; 2026</p>
  </div>
</div>
